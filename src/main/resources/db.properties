# =====================================================================
#  MediBook database settings
#  This file is copied to WEB-INF/classes/db.properties inside the war.
#  Change only the three lines below if your MySQL setup is different.
#
#  XAMPP on Windows  -> user root, password empty
#  MySQL installed   -> user root, password you chose while installing
#  University lab    -> ask the lab in-charge
# =====================================================================
db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://localhost:3306/medibook?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&characterEncoding=UTF-8
db.username=root
db.password=
